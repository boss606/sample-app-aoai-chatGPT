name: Build and deploy Python app to Azure Web App - Joogni-West

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Create deploy marker (app reads this at runtime for script cache busting)
        run: |
          echo -n "${{ github.sha }}" > DEPLOY_SHA.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enable Oryx build
        run: |
          az webapp config appsettings set --name Joogni-West --resource-group GLG-AI \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            --output none

      - name: Wait for SCM to restart after config change
        run: sleep 90

      - name: Create deployment zip
        run: zip -r deploy.zip . -x "*.git*" -x ".github/*" -x "*__pycache__*" -x "*.pyc" -x "antenv/*"

      - name: Verify static/script.js inside zip (diagnostic)
        run: |
          echo "=== MD5 of static/script.js in zip ==="
          unzip -p deploy.zip static/script.js | md5sum
          echo "=== Last 3 lines of static/script.js in zip ==="
          unzip -p deploy.zip static/script.js | tail -3
          echo "=== MD5 of DEPLOY_SHA.txt in zip ==="
          unzip -p deploy.zip DEPLOY_SHA.txt

      - name: Deploy to Azure Web App (async to avoid gateway timeout)
        run: |
          az webapp deploy --resource-group GLG-AI --name Joogni-West \
            --src-path deploy.zip --type zip --clean true --async true

      - name: Poll until deployment completes
        run: |
          echo "Polling deployment status..."
          for i in $(seq 1 20); do
            STATUS=$(az webapp deployment list --name Joogni-West --resource-group GLG-AI \
              --query "[0].provisioningState" -o tsv 2>/dev/null || echo "unknown")
            echo "Attempt $i/20 — status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "Deployment succeeded!"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            sleep 30
          done
          echo "Polling timed out — check Azure portal"
