name: Build and deploy Python app to Azure Web App - Joogni-West

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Create deploy marker (app reads this at runtime for script cache busting)
        run: |
          echo -n "${{ github.sha }}" > DEPLOY_SHA.txt

      - name: Verify package contents before upload
        run: |
          echo "=== Files in deployment package ==="
          ls -la
          echo "=== DEPLOY_SHA.txt content ==="
          cat DEPLOY_SHA.txt
          echo "=== app.py has _get_deploy_sha? ==="
          grep -c "_get_deploy_sha" app.py || true
          echo "=== templates/index.html exists? ==="
          ls -la templates/index.html
          echo "=== static/script.js exists? ==="
          ls -la static/script.js

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Verify artifact before deploy
        run: |
          echo "=== Artifact contents ==="
          ls -la
          echo "=== DEPLOY_SHA.txt ==="
          cat DEPLOY_SHA.txt 2>/dev/null || echo "NOT FOUND"
          echo "=== Target: Joogni-West, slot: Production ==="

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Disable Oryx (deploy our exact files, no build cache)
        run: |
          RG=$(az webapp show --name Joogni-West --query resourceGroup -o tsv)
          az webapp config appsettings set --name Joogni-West --resource-group $RG --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false --output none

      - name: Set startup command (use venv gunicorn)
        run: |
          RG=$(az webapp show --name Joogni-West --query resourceGroup -o tsv)
          az webapp config set --name Joogni-West --resource-group $RG --startup-file "antenv/bin/gunicorn --bind=0.0.0.0:8000 --workers=2 -k uvicorn.workers.UvicornWorker app:app" --output none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Joogni-West'
          slot-name: 'Production'
          package: .

      - name: Restart Web App
        run: |
          RG=$(az webapp show --name Joogni-West --query resourceGroup -o tsv)
          echo "Restarting Joogni-West in resource group: $RG"
          az webapp restart --name Joogni-West --resource-group $RG
