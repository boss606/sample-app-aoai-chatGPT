name: Build and deploy Python app to Azure Web App - Joogni-West

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Create deploy marker (app reads this at runtime for script cache busting)
        run: |
          echo -n "${{ github.sha }}" > DEPLOY_SHA.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Oryx and post-build script are configured
        run: |
          CURRENT=$(az webapp config appsettings list \
            --name Joogni-West --resource-group GLG-AI \
            --query "[?name=='POST_BUILD_SCRIPT_PATH'].value" -o tsv)
          if [ "$CURRENT" != "post_build.sh" ]; then
            echo "Configuring app settings (first time only)..."
            az webapp config appsettings set --name Joogni-West --resource-group GLG-AI \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true POST_BUILD_SCRIPT_PATH=post_build.sh \
              --output none
            echo "Waiting for SCM to restart..."
            sleep 120
          else
            echo "Settings already configured, skipping (no restart needed)."
          fi

      - name: Create deployment zip
        run: zip -r deploy.zip . -x "*.git*" -x ".github/*" -x "*__pycache__*" -x "*.pyc" -x "antenv/*"

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy --resource-group GLG-AI --name Joogni-West \
            --src-path deploy.zip --type zip --clean true --async false
