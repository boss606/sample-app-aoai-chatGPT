name: Build and deploy Python app to Azure Web App - Joogni-West

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Create deploy marker (app reads this at runtime for script cache busting)
        run: |
          echo -n "${{ github.sha }}" > DEPLOY_SHA.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment zip
        run: zip -r deploy.zip . -x "*.git*" -x ".github/*" -x "*__pycache__*" -x "*.pyc" -x "antenv/*"

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy --resource-group GLG-AI --name Joogni-West \
            --src-path deploy.zip --type zip --clean true --async false

      - name: Push static files directly to wwwroot (bypass Oryx cache)
        run: |
          CREDS=$(az webapp deployment list-publishing-credentials \
            --name Joogni-West --resource-group GLG-AI -o json)
          KUDU_USER=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['publishingUserName'])")
          KUDU_PASS=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['publishingPassword'])")
          KUDU_URL="https://joogni-west.scm.azurewebsites.net"

          find static/ templates/ -type f | while read f; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              "$KUDU_URL/api/vfs/site/wwwroot/$f" \
              -u "$KUDU_USER:$KUDU_PASS" \
              --data-binary "@$f" \
              -H "If-Match: *")
            echo "$f → $HTTP_CODE"
          done
