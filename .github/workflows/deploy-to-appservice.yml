name: Build and deploy Python app to Azure Web App

on:
  push:
    branches:
      - main
      - fix/msgraph-imports
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install hypercorn quart httpx azure-identity azure-storage-blob azure-ai-vision pypdf python-docx msgraph-core openai; fi

      - name: Zip app for deployment
        run: |
          zip -r app.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'YOUR_AZURE_WEBAPP_NAME' # <-- replace with your Web App name
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: app.zip
